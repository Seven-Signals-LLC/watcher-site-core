<footer class="site-footer on-night">
  <div class="wrap">
    <div class="footer__top">
      <div class="footer__brand">
        <a class="brand" href="/" aria-label="{{brand}} home">
          {{mark_light}}
          <span><span class="brand__word">{{brand_word}}</span><span class="brand__by">by 7 Signals</span></span>
        </a>
        <p class="footer__blurb">{{footer_blurb}}</p>
      </div>
{{footer_columns}}
    </div>
    <p class="footer__word" aria-hidden="true">{{brand_word}}</p>
    <div class="footer__bottom">
      <span>© {{year}} 7 Signals LLC. All rights reserved.</span>
      <nav aria-label="Legal"><a href="/privacy-policy/">Privacy Policy</a><a href="/terms/">Terms &amp; Conditions</a></nav>
    </div>
  </div>
</footer>
